<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handstorm chat</title>
    <style>
      body { font-family: monospace; }
      #api-key { -webkit-text-security: disc; }
      #story { white-space: pre-wrap; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>handstorm chat</h1>

      <form id="key-form">
        <label>
          Cerebras API key
          <input id="api-key" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" spellcheck="false" required />
        </label>
        <button>save</button>
        <output id="key-status"></output>
      </form>

      <form id="ask-form">
        <label>
          question
          <input id="question" autocomplete="off" required />
        </label>
        <button id="ask">ask</button>
        <button id="stop" type="button" hidden>stop</button>
      </form>

      <output id="status"></output>
      <dl id="items"></dl>
      <details>
        <summary>raw stream</summary>
        <pre id="raw"></pre>
      </details>

      <hr />

      <form id="story-form">
        <label>
          story
          <select id="story-start" required></select>
        </label>
        <button id="story-continue">continue</button>
        <button id="story-stop" type="button" hidden>stop</button>
      </form>

      <output id="story-status"></output>
      <article id="story"></article>
    </main>
    <script type="module" src="/src/chat/main.ts"></script>
    <script type="module" src="/src/chat/story.ts"></script>
  </body>
</html>
