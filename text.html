<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>text fit</title>
    <style>
      :root {
        --padding: 32px;
        --attention: rgb(0 0 0 / 0.1);
      }
      body {
        font: 20px monospace;
        margin: 0;
      }
      #text {
        padding: var(--padding);
        white-space: pre;
        line-height: 30px;
        touch-action: none;

        &::selection {
          background: var(--attention);
          color: inherit;
        }
      }
      ::highlight(attention-word) {
        text-decoration: underline;
      }
      ::highlight(attention-shade-1),
      ::highlight(attention-shade-2),
      ::highlight(attention-shade-3),
      ::highlight(attention-shade-4),
      ::highlight(attention-shade-5) {
        background: var(--attention);
      }
      .knob {
        position: absolute;
        top: 0;
        left: 0;
        width: 2rem;
        height: 2rem;
        border: 2px solid black;
        border-radius: 50%;
        background: none;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="text"></div>
    <button id="pointer" class="knob" type="button" aria-label="drag to generate text, hold still for attention highlights"></button>
    <script type="module" src="/src/text/main.ts"></script>
  </body>
</html>
