<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>text fit</title>
    <style>
      @property --fill {
        syntax: "<number>";
        inherits: false;
        initial-value: 0;
      }
      :root {
        --padding: 32px;
        /* Room each side of the column for pinned future knobs and their labels. */
        --margin: 24ch;
        --knob: 24px;
        --gap: 8px;
        --attention: rgb(0 0 0 / 0.1);
        --underline: 2px;
        --dimmed: 0.3;
        --lightest: 100;
        --boldest: 800;
        scrollbar-gutter: stable;
      }
      [data-dimmed] {
        opacity: var(--dimmed);
      }
      body {
        font:
          15px "JetBrains Mono Variable",
          monospace;
        margin: 0;
      }
      #text {
        width: clamp(30ch, 100% - 2 * var(--margin), 64ch);
        margin-inline: auto;
        padding-block: var(--padding);
        white-space: pre;
        line-height: 24px;
        touch-action: none;
        text-underline-position: under;

        &::selection {
          background: var(--attention);
          color: inherit;
        }

        span {
          transition: font-weight 0.2s;
        }

        &[data-weighing] span {
          font-weight: calc(var(--lightest) + var(--influence, 0) * (var(--boldest) - var(--lightest)));
        }
      }
      ::highlight(attention-word) {
        text-decoration: underline var(--underline);
      }
      #links {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;

        path {
          fill: none;
          stroke: currentColor;
          stroke-width: var(--underline);
        }

        #future-links,
        #future-tuned-link {
          stroke-dasharray: 6 4;
        }

        #future-hud {
          pointer-events: none;

          path {
            fill: none;
            stroke: currentColor;
            stroke-width: var(--underline);

            &[data-dashed] {
              stroke-dasharray: 6 4;
            }

            &[data-backdrop] {
              fill: Canvas;
              stroke: none;
              opacity: 0.92;
            }
          }

          circle {
            fill: currentColor;
            stroke: none;
          }

          text {
            fill: currentColor;
            stroke: Canvas;
            stroke-width: 6px;
            paint-order: stroke;
            font: inherit;

            &[data-selected] {
              text-decoration: underline var(--underline);
              stroke: none;
            }
          }
        }
      }
      ::highlight(pinned-sentence) {
        text-decoration: underline dashed var(--underline);
      }
      ::highlight(attention-shade-1),
      ::highlight(attention-shade-2),
      ::highlight(attention-shade-3),
      ::highlight(attention-shade-4),
      ::highlight(attention-shade-5) {
        background: var(--attention);
      }
      .knob {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--knob);
        height: var(--knob);
        padding: 0;
        border: 2px solid black;
        border-radius: 50%;
        background: conic-gradient(black calc(var(--fill, 0) * 1turn), transparent 0);
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      .future {
        border-style: dashed;
        background: conic-gradient(black calc(var(--fill, 0) * 1turn), Canvas 0);
        font: inherit;
        color: inherit;

        span {
          position: absolute;
          top: 50%;
          left: calc(100% + var(--gap));
          translate: 0 -50%;
          white-space: nowrap;
          pointer-events: none;
          background: Canvas;

          &[hidden] {
            display: none;
          }
        }

        &[data-dimmed] span {
          background: transparent;
        }

        &[data-tracking] {
          transition: --fill 0.3s;
        }

        &[data-pinned] {
          border-style: solid;
          cursor: default;
          transition:
            translate 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
            --fill 0.3s;

          span {
            width: max-content;
            white-space: normal;
            text-align: start;
            background: transparent;
            pointer-events: auto;
          }

          &[data-side="left"] span {
            text-align: end;
          }
        }

        &[data-side="left"] span {
          left: auto;
          right: calc(100% + var(--gap));
        }
      }
    </style>
  </head>
  <body>
    <div id="text"></div>
    <svg id="links" aria-hidden="true">
      <path id="attention-links" />
      <g id="future-hud"></g>
      <path id="future-links" />
      <path id="future-tuned-link" />
    </svg>
    <button
      id="pointer"
      class="knob"
      type="button"
      aria-label="drag to generate text, double click to expand attention highlights or remove everything attached, hold still to spawn a future knob"
    ></button>
    <template id="future-knob">
      <button class="knob future" type="button" aria-label="future knob, …, double click to delete"><span>…</span></button>
    </template>
    <script type="module" src="/src/text/main.ts"></script>
  </body>
</html>
