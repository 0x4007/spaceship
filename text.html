<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>text fit</title>
    <style>
      :root {
        --padding: 32px;
        --attention: rgb(0 0 0 / 0.1);
        --underline: 2px;
        --dimmed: 0.3;
        scrollbar-gutter: stable;
      }
      [data-dimmed] {
        opacity: var(--dimmed);
      }
      body {
        font: 20px monospace;
        margin: 0;
      }
      #text {
        padding: var(--padding);
        white-space: pre;
        line-height: 30px;
        touch-action: none;
        text-underline-position: under;

        &::selection {
          background: var(--attention);
          color: inherit;
        }
      }
      ::highlight(attention-word) {
        text-decoration: underline var(--underline);
      }
      #links {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;

        path {
          fill: none;
          stroke: currentColor;
          stroke-width: var(--underline);
        }

        #future-links,
        #future-tuned-link {
          stroke-dasharray: 6 4;
        }

        #future-hud {
          pointer-events: none;

          path {
            fill: none;
            stroke: currentColor;
            stroke-width: var(--underline);
          }

          circle {
            fill: currentColor;
            stroke: none;
          }

          text {
            fill: currentColor;
            stroke: none;
            font: inherit;

            &[data-selected] {
              text-decoration: underline var(--underline);
            }
          }
        }
      }
      ::highlight(attention-shade-1),
      ::highlight(attention-shade-2),
      ::highlight(attention-shade-3),
      ::highlight(attention-shade-4),
      ::highlight(attention-shade-5) {
        background: var(--attention);
      }
      .knob {
        position: absolute;
        top: 0;
        left: 0;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 2px solid black;
        border-radius: 50%;
        background: conic-gradient(black calc(var(--fill, 0) * 1turn), transparent 0);
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      .future {
        border-style: dashed;
        background: conic-gradient(from calc(var(--fill-from, 0) * 1turn), black calc(var(--fill, 0) * 1turn), Canvas 0);
        font: inherit;
        color: inherit;

        span {
          position: absolute;
          top: 50%;
          left: calc(100% + 0.5rem);
          translate: 0 -50%;
          white-space: nowrap;
          pointer-events: none;
          background: Canvas;

          &[hidden] {
            display: none;
          }
        }

        &[data-side="left"] span {
          left: auto;
          right: calc(100% + 0.5rem);
        }
      }
    </style>
  </head>
  <body>
    <div id="text"></div>
    <svg id="links" aria-hidden="true">
      <path id="attention-links" />
      <path id="future-links" />
      <path id="future-tuned-link" />
      <g id="future-hud"></g>
    </svg>
    <button
      id="pointer"
      class="knob"
      type="button"
      aria-label="drag to generate text, double click to expand attention highlights or remove everything attached, hold still to spawn a future knob"
    ></button>
    <template id="future-knob">
      <button class="knob future" type="button" aria-label="future knob, …, double click to delete"><span>…</span></button>
    </template>
    <script type="module" src="/src/text/main.ts"></script>
  </body>
</html>
