name: Build Spaceship

on:
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent build
concurrency:
  group: "spaceship-build"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          lfs: false
      - name: npm install, build, and test
        run: |
          npm ci
          npm test
          npm run build
