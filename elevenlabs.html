<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElevenLabs Scribe v2 Realtime STT</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      input,
      button {
        padding: 4px 8px;
        font-size: 13px;
      }
      #status {
        font-size: 12px;
        color: #666;
      }
      #output {
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        resize: none;
        padding: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>API Key: <input id="apiKey" type="password" placeholder="xi-api-key..." /></label>
      <label>Language: <input id="language" type="text" placeholder="Auto (e.g. en)" style="width: 90px" /></label>
      <button id="recordBtn">⏺ Record & Stream</button>
      <button id="stopBtn" disabled>⏹ Stop</button>
      <span id="status">Idle</span>
    </div>
    <textarea id="output" readonly placeholder="Transcription will appear here..."></textarea>

    <script>
      const SAMPLE_RATE = 16000;
      const API_HOST = "api.elevenlabs.io";

      const apiKeyInput = document.getElementById("apiKey");
      const langInput = document.getElementById("language");
      const recordBtn = document.getElementById("recordBtn");
      const stopBtn = document.getElementById("stopBtn");
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");

      // Persist inputs in localStorage
      apiKeyInput.value = localStorage.getItem("el_key") ?? "";
      langInput.value = localStorage.getItem("el_lang") ?? "";
      apiKeyInput.oninput = () => localStorage.setItem("el_key", apiKeyInput.value);
      langInput.oninput = () => localStorage.setItem("el_lang", langInput.value);

      let stopRecording = null;

      recordBtn.onclick = async () => {
        const key = apiKeyInput.value.trim();
        if (!key) return (statusEl.textContent = "API Key is required.");

        recordBtn.disabled = true;
        outputEl.value = "";

        try {
          // 1. Exchange API key for a single-use WebSocket token
          statusEl.textContent = "Fetching token...";
          const tokenResp = await fetch(`https://${API_HOST}/v1/single-use-token/realtime_scribe`, {
            method: "POST",
            headers: { "xi-api-key": key },
          });
          if (!tokenResp.ok) throw new Error(`Token HTTP ${tokenResp.status}: ${await tokenResp.text()}`);
          const { token } = await tokenResp.json();

          // 2. Connect to ElevenLabs Realtime WebSocket
          statusEl.textContent = "Connecting WebSocket...";
          const params = new URLSearchParams({
            model_id: "scribe_v2_realtime",
            audio_format: `pcm_${SAMPLE_RATE}`,
            commit_strategy: "manual",
            token,
          });
          if (langInput.value.trim()) params.set("language_code", langInput.value.trim());

          const ws = new WebSocket(`wss://${API_HOST}/v1/speech-to-text/realtime?${params}`);

          let commitSent = false;
          const segments = [];
          let partial = "";
          const renderText = () => (outputEl.value = [...segments, partial].filter(Boolean).join(" "));

          const finalTranscript = new Promise((resolve, reject) => {
            ws.onmessage = ({ data }) => {
              const msg = JSON.parse(data);
              if (msg.message_type === "partial_transcript") {
                partial = msg.text ?? "";
                renderText();
              } else if (msg.message_type === "committed_transcript") {
                partial = "";
                if (msg.text?.trim()) segments.push(msg.text.trim());
                renderText();
                if (commitSent) resolve();
              } else if (msg.error || msg.message_type?.endsWith("_error")) {
                reject(new Error(msg.error ?? JSON.stringify(msg)));
              }
            };
            ws.onerror = () => reject(new Error("WebSocket error"));
            ws.onclose = (e) => reject(new Error(`WebSocket closed (${e.code})`));
          });

          await new Promise((res, rej) => {
            ws.onopen = res;
            finalTranscript.catch(rej);
          });

          // 3. Capture Microphone as 16kHz Mono PCM16 and stream with 1-chunk holdback
          const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
          const source = audioCtx.createMediaStreamSource(micStream);
          const processor = audioCtx.createScriptProcessor(4096, 1, 1);

          let heldChunk = null;
          const sendChunk = (pcmBytes, commit) => {
            if (commit) commitSent = true;
            ws.send(
              JSON.stringify({
                message_type: "input_audio_chunk",
                audio_base_64: bytesToBase64(pcmBytes),
                commit,
                sample_rate: SAMPLE_RATE,
              }),
            );
          };

          processor.onaudioprocess = ({ inputBuffer }) => {
            const pcmBytes = float32To16BitPCM(inputBuffer.getChannelData(0));
            if (heldChunk) sendChunk(heldChunk, false);
            heldChunk = pcmBytes;
          };

          source.connect(processor);
          processor.connect(audioCtx.destination);

          stopBtn.disabled = false;
          statusEl.textContent = "Recording & streaming...";

          // 4. Wait for user to click Stop, then send final chunk with commit: true
          await new Promise((resolve) => (stopRecording = resolve));
          stopBtn.disabled = true;
          statusEl.textContent = "Stopping & awaiting final transcript...";

          processor.disconnect();
          source.disconnect();
          micStream.getTracks().forEach((t) => t.stop());
          await audioCtx.close();

          if (!heldChunk) throw new Error("No audio recorded");
          sendChunk(heldChunk, true);

          await finalTranscript;
          ws.onclose = ws.onerror = null;
          ws.close();
          statusEl.textContent = "Done.";
        } catch (err) {
          statusEl.textContent = "Error: " + err.message;
        } finally {
          recordBtn.disabled = false;
          stopBtn.disabled = true;
        }
      };

      stopBtn.onclick = () => stopRecording?.();

      function float32To16BitPCM(samples) {
        const pcm16 = Int16Array.from(samples, (s) => {
          const clamped = Math.max(-1, Math.min(1, s));
          return clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff;
        });
        return new Uint8Array(pcm16.buffer);
      }

      function bytesToBase64(bytes) {
        let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }
    </script>
  </body>
</html>
