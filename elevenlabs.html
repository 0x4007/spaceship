<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElevenLabs Scribe v2 Realtime STT (AudioWorklet)</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      input,
      button {
        padding: 4px 8px;
        font-size: 13px;
      }
      input[type="checkbox"] {
        padding: 0;
      }
      #status {
        font-size: 12px;
        color: #666;
      }
      #output {
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        overflow-y: auto;
        white-space: pre-wrap;
        padding: 8px;
        font-size: 14px;
        color: #000;
        border: 1px solid #ccc;
        border-radius: 2px;
        background: #fff;
      }
      #output:empty::before {
        content: attr(data-placeholder);
        color: #999;
      }
      #output .partial {
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>API Key: <input id="apiKey" type="password" placeholder="xi-api-key..." /></label>
      <label>Language: <input id="language" type="text" placeholder="Auto (e.g. en)" style="width: 90px" /></label>
      <label title="Server commits transcripts automatically when you pause speaking (VAD)">
        <input id="autoCommit" type="checkbox" checked /> Auto commit (VAD)
      </label>
      <button id="recordBtn">⏺ Record & Stream</button>
      <button id="stopBtn" disabled>⏹ Stop</button>
      <span id="status">Idle</span>
    </div>
    <div id="output" data-placeholder="Transcription will appear here..."></div>

    <script>
      const SAMPLE_RATE = 16000;
      const API_HOST = "api.elevenlabs.io";
      const AUTO_FLUSH_TIMEOUT_MS = 3000; // max wait for the last commit in auto mode

      const VAD_PARAMS = {
        vad_silence_threshold_secs: "0.3", // [0.3-3.0]
        vad_threshold: "0.4", //              [0.1-0.9]
        min_speech_duration_ms: "100", //     [50-2000]
        min_silence_duration_ms: "100", //    [50-2000]
      };

      // Audio thread: float samples -> Int16 PCM, posted every 4096 samples (~256ms @ 16kHz).
      const WORKLET_CODE = `
        class PcmProcessor extends AudioWorkletProcessor {
          buffer = new Int16Array(4096);
          offset = 0;
          process(inputs) {
            for (const x of inputs[0]?.[0] ?? []) {
              const s = Math.max(-1, Math.min(1, x));
              this.buffer[this.offset++] = s < 0 ? s * 0x8000 : s * 0x7fff;
              if (this.offset === this.buffer.length) {
                this.port.postMessage(new Uint8Array(this.buffer.buffer.slice(0)));
                this.offset = 0;
              }
            }
            return true;
          }
        }
        registerProcessor("pcm-processor", PcmProcessor);
      `;
      const WORKLET_URL = URL.createObjectURL(new Blob([WORKLET_CODE], { type: "application/javascript" }));

      const $ = (id) => document.getElementById(id);
      const [apiKeyInput, langInput, autoCommitInput, recordBtn, stopBtn, statusEl, outputEl] = [
        "apiKey",
        "language",
        "autoCommit",
        "recordBtn",
        "stopBtn",
        "status",
        "output",
      ].map($);

      // Persist inputs in localStorage
      for (const [input, key] of [
        [apiKeyInput, "el_key"],
        [langInput, "el_lang"],
      ]) {
        input.value = localStorage.getItem(key) ?? "";
        input.oninput = () => localStorage.setItem(key, input.value);
      }
      autoCommitInput.checked = (localStorage.getItem("el_auto") ?? "1") === "1";
      autoCommitInput.onchange = () => localStorage.setItem("el_auto", autoCommitInput.checked ? "1" : "0");

      const setStatus = (text) => (statusEl.textContent = text);
      const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes));

      let stopRecording;
      stopBtn.onclick = () => stopRecording?.();

      recordBtn.onclick = async () => {
        const key = apiKeyInput.value.trim();
        if (!key) return setStatus("API Key is required.");

        const autoCommit = autoCommitInput.checked;

        recordBtn.disabled = true;
        autoCommitInput.disabled = true;
        outputEl.replaceChildren();

        try {
          // 1. Exchange API key for a single-use WebSocket token
          setStatus("Fetching token...");
          const tokenResp = await fetch(`https://${API_HOST}/v1/single-use-token/realtime_scribe`, {
            method: "POST",
            headers: { "xi-api-key": key },
          });
          if (!tokenResp.ok) throw new Error(`Token HTTP ${tokenResp.status}: ${await tokenResp.text()}`);
          const { token } = await tokenResp.json();

          // 2. Connect WebSocket
          setStatus("Connecting WebSocket...");
          const params = new URLSearchParams({
            model_id: "scribe_v2_realtime",
            audio_format: `pcm_${SAMPLE_RATE}`,
            commit_strategy: autoCommit ? "vad" : "manual",
            token,
            ...(autoCommit && VAD_PARAMS),
          });
          const language = langInput.value.trim();
          if (language) params.set("language_code", language);

          const ws = new WebSocket(`wss://${API_HOST}/v1/speech-to-text/realtime?${params}`);

          let commitSent = false;
          let partial = "";
          const segments = [];

          const render = () => {
            outputEl.replaceChildren(segments.join(" "));
            if (partial) {
              const span = document.createElement("span");
              span.className = "partial";
              span.textContent = (segments.length ? " " : "") + partial;
              outputEl.append(span);
            }
            outputEl.scrollTop = outputEl.scrollHeight;
          };

          // Settles when the final committed transcript arrives (or on any failure)
          const finalTranscript = new Promise((resolve, reject) => {
            ws.onmessage = ({ data }) => {
              const msg = JSON.parse(data);
              if (msg.message_type === "partial_transcript") {
                partial = msg.text ?? "";
                render();
              } else if (msg.message_type === "committed_transcript") {
                partial = "";
                if (msg.text?.trim()) segments.push(msg.text.trim());
                render();
                if (commitSent) resolve();
              } else if (msg.error || msg.message_type?.endsWith("_error")) {
                reject(new Error(msg.error ?? JSON.stringify(msg)));
              }
            };
            ws.onerror = () => reject(new Error("WebSocket error"));
            ws.onclose = (e) => reject(new Error(`WebSocket closed (${e.code})`));
          });

          await new Promise((resolve, reject) => {
            ws.onopen = resolve;
            finalTranscript.catch(reject);
          });

          // 3. Capture mic as 16kHz mono PCM16 via AudioWorklet
          const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
          await audioCtx.audioWorklet.addModule(WORKLET_URL);

          const source = audioCtx.createMediaStreamSource(micStream);
          const worklet = new AudioWorkletNode(audioCtx, "pcm-processor");

          const sendChunk = (pcm, commit = false) => {
            commitSent ||= commit;
            ws.send(
              JSON.stringify({
                message_type: "input_audio_chunk",
                audio_base_64: toBase64(pcm),
                commit,
                sample_rate: SAMPLE_RATE,
              }),
            );
          };

          // Hold back the newest chunk so the last one can carry commit: true
          let heldChunk = null;
          worklet.port.onmessage = ({ data }) => {
            if (heldChunk) sendChunk(heldChunk);
            heldChunk = data;
          };

          source.connect(worklet);

          stopBtn.disabled = false;
          setStatus(autoCommit ? "Recording (auto commit on pauses)..." : "Recording & streaming...");

          // 4. Wait for Stop, then flush the held chunk with commit
          await new Promise((resolve) => (stopRecording = resolve));
          stopBtn.disabled = true;
          setStatus("Stopping & awaiting final transcript...");

          worklet.disconnect();
          source.disconnect();
          micStream.getTracks().forEach((t) => t.stop());
          await audioCtx.close();

          if (!heldChunk) throw new Error("No audio recorded");
          sendChunk(heldChunk, true);

          // In auto mode the server may not answer the manual commit, so wait a bounded time
          await (autoCommit ? Promise.race([finalTranscript, new Promise((r) => setTimeout(r, AUTO_FLUSH_TIMEOUT_MS))]) : finalTranscript);

          // Commit any remaining partial locally (no-op if the final commit arrived)
          if (partial.trim()) segments.push(partial.trim());
          partial = "";
          render();

          ws.onclose = ws.onerror = null;
          ws.close();
          setStatus("Done.");
        } catch (err) {
          setStatus("Error: " + err.message);
        } finally {
          recordBtn.disabled = false;
          autoCommitInput.disabled = false;
          stopBtn.disabled = true;
        }
      };
    </script>
  </body>
</html>
