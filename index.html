<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handstorm</title>
  </head>
  <body>
    <main>
      <header>
        <h1>handstorm</h1>
        <label>
          camera
          <select id="camera"></select>
        </label>
        <output id="status">loading model…</output>
      </header>
      <figure>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </figure>
      <section>
        <h2>debug</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">hand</th>
              <th scope="col">pinching</th>
            </tr>
          </thead>
          <tbody>
            <tr data-hand="Left">
              <th scope="row">left</th>
              <td>—</td>
            </tr>
            <tr data-hand="Right">
              <th scope="row">right</th>
              <td>—</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
