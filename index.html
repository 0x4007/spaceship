<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handstorm</title>
  </head>
  <body>
    <main>
      <header>
        <h1>handstorm</h1>
        <label>
          camera
          <select id="camera"></select>
        </label>
        <label>
          <input type="checkbox" id="skeleton" />
          skeleton
        </label>
        <label>
          <input type="checkbox" id="sound" role="switch" />
          sound
        </label>
        <output id="status">loading model…</output>
      </header>
      <figure>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </figure>
      <section>
        <h2>debug</h2>
        <form id="elevenlabs-key-form" autocomplete="off">
          <label>
            elevenlabs api key
            <input
              type="password"
              autocomplete="off"
              data-1p-ignore
              data-lpignore="true"
              data-bwignore
              data-form-type="other"
            />
          </label>
          <button>save</button>
        </form>
        <form id="cerebras-key-form" autocomplete="off">
          <label>
            cerebras api key
            <input
              type="password"
              autocomplete="off"
              data-1p-ignore
              data-lpignore="true"
              data-bwignore
              data-form-type="other"
            />
          </label>
          <button>save</button>
        </form>
        <table>
          <thead>
            <tr>
              <th scope="col">hand</th>
              <th scope="col">pinching</th>
              <th scope="col">openness</th>
              <th scope="col">roll</th>
              <th scope="col">index in other palm</th>
            </tr>
          </thead>
          <tbody>
            <tr data-hand="Left">
              <th scope="row">left</th>
              <td data-field="pinching">—</td>
              <td data-field="openness">—</td>
              <td data-field="roll">—</td>
              <td data-field="palm">—</td>
            </tr>
            <tr data-hand="Right">
              <th scope="row">right</th>
              <td data-field="pinching">—</td>
              <td data-field="openness">—</td>
              <td data-field="roll">—</td>
              <td data-field="palm">—</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
